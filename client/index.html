<body>
  <noscript>
    <div style="max-width:720px;margin:0 auto;padding:24px;font-family:system-ui,sans-serif;color:#e2e8f0;background:#12100e;">
      <h1>Helloooo — Random Video Chat &amp; Voice Rooms</h1>
      <p>Free anonymous video chat, text chat, and live voice rooms. Meet strangers who share your interests — an Omegle-style alternative with group video, creators, and AI safety.</p>

    </div>
  </noscript>
  <div id="root">
    <div id="boot-fallback" class="boot-screen" role="status" aria-live="polite" aria-label="Helloooo loading">
      <div class="boot-screen__ring" aria-hidden="true">
        <div class="boot-screen__orbit"></div>
        <div class="boot-screen__orbit boot-screen__orbit--inner"></div>
        <div class="boot-screen__core">
          <img class="boot-screen__logo" src="/helloooo-logo.png" alt="" width="40" height="40" decoding="async" />
        </div>
      </div>
      <p class="boot-screen__brand">
        <img class="boot-screen__wordmark" src="/helloooo-wordmark-dark.svg" alt="Helloooo" />
      </p>
      <p class="boot-screen__hint">
        Loading
        <span class="boot-screen__dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </p>
    </div>
  </div>
  <script>
    (function () {
      var mounted = false;
      window.__HELLOOOO_MOUNTED__ = function () { mounted = true; };

      function bootFail(reason) {
        if (mounted) return;
        var el = document.getElementById('boot-fallback') || document.getElementById('root');
        if (!el) return;
        el.innerHTML =
          '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#12100e;color:#fff;font-family:system-ui,sans-serif;padding:24px;text-align:center;gap:12px;">' +
          '<p style="color:#f87171;font-weight:600;margin:0;">App failed to load</p>' +
          '<p style="color:#94a3b8;font-size:13px;max-width:340px;margin:0;line-height:1.5;">' +
          (reason === 'timeout'
            ? 'Helloooo is taking too long. Your browser may have cached an old version — try a hard refresh.'
            : 'Cached files may be outdated after an update. Hard refresh (Ctrl+Shift+R) or clear site data for helloooo.site.') +
          '</p>' +
          '<button type="button" onclick="location.reload()" style="margin-top:8px;padding:10px 20px;border-radius:10px;border:none;background:linear-gradient(135deg,#c084fc,#2563eb);color:#fff;font-weight:600;cursor:pointer;">Reload</button>' +
          '</div>';
      }

      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('/assets/') !== -1) {
          bootFail('script');
          return;
        }
        if (!mounted && e.message && !e.message.includes('ResizeObserver')) {
          bootFail('runtime');
        }
      }, true);

      window.addEventListener('unhandledrejection', function () {
        if (!mounted) bootFail('module');
      });

      setTimeout(function () {
        if (!mounted && document.getElementById('boot-fallback')) bootFail('timeout');
      }, 15000);
    })();
  </script>
